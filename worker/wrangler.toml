# The Worker for syahi.sh: real 301 redirects and server-side campaign stamping.
# Written and unit-tested here, not deployed. Routes and custom domains are added in Part C, with her token.
name = "syahi-site"
main = "src/index.js"
compatibility_date = "2026-10-06"
# The site is served only on its own domains: no public workers.dev or preview address.
workers_dev = false
preview_urls = false

[assets]
directory = "../dist/syahi.sh"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

# Request logging stays off: the Worker never records a visitor.
[observability]
enabled = false

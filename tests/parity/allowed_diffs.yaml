# The Signet page (signet-landing a0bb211, the page signet.syahi.sh serves today).
signet.html:
  - text: "SIGNET by Syahi"
    reason: >-
      The page's own header: a seal, the wordmark SIGNET and the byline "by Syahi". The shared header
      (wordmark, tabs, Book a call) replaces it, as it replaces every ported page's own chrome.
  - text: "01"
    reason: >-
      Step number of the first beat. The number is drawn by a CSS counter (a zero-padded counter style) beside the
      beat's icon, so the reader still sees 01 but it is no longer text in the page. A bare "01" would otherwise
      be a number outside a claim (htmlcheck numbers-from-claims).
  - text: "02"
    reason: Step number of the second beat, drawn by the same counter. Same reason as 01.
  - text: "03"
    reason: Step number of the third beat, drawn by the same counter. Same reason as 01.

# Elements the old page carried that the port does not, none of them text the reader reads. Keyed by
# snapshot file name. `match` is the opening of the element as the snapshot writes it; a test fails an
# entry the snapshot no longer holds, and checks the new page holds none of them. The reason says why.
removed_elements:
  site-index.html:
    - match: '<canvas id="fluidlayer"'
      reason: >-
        The fluid ink canvas (ruling D21): the moving ink and the fluid.js that drew it are gone, so the
        page has no script. It carries no text, so no word of copy changes.
    - match: '<canvas id="inklayer"'
      reason: >-
        The click-splat and cursor-trail canvas, the same moving ink as the fluid layer and dropped with
        it (D21). It carries no text.
    - match: '<svg class="grain"'
      reason: >-
        A fixed, full-viewport film-grain overlay (an SVG turbulence filter at 5 percent opacity). It carries
        no text, and a filtered layer over the whole page is a paint cost the performance budget does not need.
    - match: "<script>"
      reason: >-
        The page's two inline scripts: the motion switch in the head and the loader for the moving ink
        (scroll reveals, splats, the living drop, fluid.js). The build's pages carry no script except
        structured data. The scroll reveals were decoration; every card and heading is visible at once.
    - match: "<footer>"
      reason: >-
        The page's own footer (the signature line, the legal line, six links and the place line) is
        replaced by the shared footer. Where each link went: privacy, terms, refunds and contact are the
        shared footer's policy row; book a call is the header's button; the email and WhatsApp number are
        on /contact; the x and personal github links are not carried, because the shared footer shows
        company profiles only (D5).
  signet.html:
    - match: "<header>"
      reason: >-
        The page's own header (a seal, the wordmark SIGNET and "by Syahi"; its wordmark linked to the page's own
        root) is replaced by the shared header: the Syahi wordmark, the four tabs and the Book a call button. Its
        words are the text entry above.
    - match: "<footer>"
      reason: >-
        The page's own footer (a seal, SIGNET by Syahi, the motto "ink, seal, parchment", a copyright line and five
        links) is replaced by the shared footer. Where each link went: the link to the main site is the shared
        wordmark's link to the home page; contact, privacy, terms and refunds are the shared footer's policy row.
        The motto and the copyright line are not carried: the shared footer shows the legal line and the made-by
        line instead.
    - match: "<script>"
      reason: >-
        The one inline script, which only set a class on the root element for styles that never used it. The
        build's pages carry no script except structured data, and the page's sheet has no rule that reads the class.
